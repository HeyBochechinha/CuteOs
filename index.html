<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuteOs</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="top-bar">
        <div class="os-name">🌸 CuteOS</div>
        <p>♡ Hello World ♡</p>
        <p id="timeElement">Loading time...</p>
    </div>

    <div class="desktop">
        <div class="desktop-icon">
            <span class="emoji">📁</span>
            My Files
        </div>

        <div class="desktop-icon">
            <span class="emoji">🎨</span>
            My Art
        </div>

        <div class="window">

            <div class="window-header">
                <span>♡ Welcome.exe</span>
                <span>● ● ●</span>
            </div>

            <div class="window-content">
                <h1>Welcome to CuteOS!</h1>
                <p>Hello! 🌷<br>Welcome to my little digital world.</p>
                <button class="cute-button" onclick="sayHello()">Click me! ♡</button>
                <p id="message" style="margin-top: 18px; margin-bottom: 0;"></p>
            </div>
        </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
